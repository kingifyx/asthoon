plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'org.jetbrains.kotlin.jvm' version '2.3.21'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Loom adds the essential maven repositories to download Minecraft and
    // libraries from automatically.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.1+ ships unobfuscated, so there is no mappings artifact to
    // depend on and no more modImplementation/modApi remapping step.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

kotlin {
    jvmToolchain(25)
}

tasks.register('regressionCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.asthoonlite.dungeon.DungeonRegressionCheckKt'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    workingDir = layout.buildDirectory.dir('regression-check').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.named('check') { dependsOn 'regressionCheck' }
// The checks above use Kotlin check(), without a test framework.
tasks.named('test') { failOnNoDiscoveredTests = false }

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
